<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="docsify-isf — interactive ISF shader viewer for Docsify pages." />
    <title>docsify-isf — self-test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css"
        media="(prefers-color-scheme: dark)" />
    <style>
        :root {
            --theme-color: #d374d6;
            /* The self-test is a viewer gallery: use a wider stage while
               keeping prose at a readable measure. */
            --content-max-width: 960px;
            --content-margin-inline: clamp(18px, 4vw, 45px);
            --sidebar-width: 268px;
            --sidebar-font-size: 15px;
            --sidebar-link-spacing: 0.55em;
            --sidebar-name-font-size: var(--font-size-l);
        }
        .markdown-section > :is(p, ul, ol, blockquote, table, pre) {
            max-width: 72ch;
        }
        .markdown-section > .isf-block,
        .markdown-section > p:has(> .isf-block) {
            max-width: none;
        }
        @media (max-width: 640px) {
            :root {
                --content-margin-inline: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        window.$docsify = {
            name: 'docsify-isf',
            repo: 'gllmAR/docsify-isf',
            loadSidebar: false,
            relativePath: true,
            auto2top: true,
            isf: {
                // This is also the default configuration; it is spelled out so
                // the self-test page documents what it is exercising.
                mode: 'replace',
                lazy: 'visible',
                aspectRatio: '16/9',
                controls: true,
                params: 'auto',
                paramsOpenLimit: 6,
                autoplay: true,
                editor: true,
                editorLive: true,
                maxContexts: 8,
                maxPixelRatio: 2,
                showStats: true,
                showSource: true
            }
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="./docsify-isf.js"></script>
</body>

</html>
